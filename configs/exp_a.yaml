# Experiment A: baseline CNN, honest evaluation under the patient-grouped,
# leakage-free split (see the project plan's experiment sequence).
# This is the REAL experiment config — not yet run as of writing.

name: exp_a_baseline

data:
  manifest_path: data/manifest.csv
  image_size: 224
  num_channels: 1
  mean: [0.4073]
  std: [0.2863]
  batch_size: 32
  seed: 42
  num_workers: 0
  class_balance: loss_weight   # dataset is imbalanced (272 COVID vs 1583 NORMAL)

model:
  architecture: baseline_cnn
  in_channels: 1
  channels: [32, 64, 128, 256]
  dropout: 0.3

train:
  max_epochs: 30
  patience: 5
  learning_rate: 0.001
  seed: 42
