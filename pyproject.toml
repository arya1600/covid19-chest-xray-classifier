[project]
name = "covidcxr"
version = "0.1.0"
description = "Reproducible, patient-aware chest X-ray classification research project (educational, not for clinical use)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "Pillow>=10.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
